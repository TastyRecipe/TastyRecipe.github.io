<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Test</title>
</head>
<body>
    <main>
        <main>
            <P>
                This is some text for development.
            </P>
            <input type="file" accept="image/*. video/*">
            <p>Something should be here, hopefully.</p>
        </main>
        <input type="file" accept="image/*. video/*" multiple name="img1" onchange="onFileSelected(event)">
        <p>This is some Text. Please give me a photo</p>
        <input type="file" accept="image/*. video/*" name="img2">

        <p>Here is a Form</p>

        <form>
            <p>Test Title</p>
            <label for="q1">Question 1</label><br>
            <input type="text" id="q1" name="test" value="N.A.">
            <br>
            <label for="q2">question 2</label><br>
            <input type="text" id="q2" name="test2" placeholder="put stuff here please">
            <br>
            <label for="im1">Add an image pls</label><br>
            <input type="file" accept="image/*. video/*" name="img3">
            <br>
            <label for="q3">more words here</label><br>
            <textarea id="q3" name="test3" rows="6" cols="100">test of words here</textarea>
            <br>
            <input type="file" accept="image/*. video/*" name="img4">
            <br>
            <input type="submit">
        </form>
        <p>End of Form</p>

        <p>Heres the first image you selected!</p>

        <img id="myImage">
        <p id="imgName">Name:</p>
        <script>
            function onFileSelected(event) {
                var selectedFile = event.target.files[0];
                var reader = new FileReader();

                var imgTag = document.getElementById("myImage");
                var imgName = document.getElementById("imgName");
                imgTag.title = selectedFile.name;
                imgName.innerHTML = "Nombre:"+imgTag.title;

                reader.onload = function(event) {
                    imgTag.src = event.target.result;
                    
                };
                reader.readAsDataURL(selectedFile);
            }
        </script>

        <input type="file" id="file-selector" multiple>
        <script>
        const fileSelector = document.getElementById('file-selector');
        fileSelector.addEventListener('change', (event) => {
            const fileList = event.target.files;
            console.log(fileList);
            console.log("Test");
            console.log(fileList[0].name);
        });
        </script>

        <input type="button" 
            value="Generate PDF" 
            onclick="saveToPDF()">

        <script>
            function saveToPDF(){
                html2pdf(document.body).set({pagebreak: {mode: 'avoid-all'}})
            }
        </script>
    </main>
    
</body>
</html>
